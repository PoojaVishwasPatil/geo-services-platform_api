services:
  # PostgreSQL 16 with PostGIS Spatial Extension
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geo_services_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nearby_services}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nearby_services"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 for Caching & Sliding Window Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: geo_services_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
